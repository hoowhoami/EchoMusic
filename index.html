<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EchoMusic</title>
    <script>
      if (typeof window.echoInitialDark === 'boolean') {
        document.documentElement.classList.toggle('dark', window.echoInitialDark);
        const background = document.createElement('style');
        background.textContent = 'html { background: #f5f5f7; } html.dark { background: #26262a; }';
        document.head.appendChild(background);
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/renderer/main.ts"></script>
  </body>
</html>
