[package]
name = "echo-platform-adaptor"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"

[lib]
crate-type = ["cdylib"]

[build-dependencies]
napi-build = "2"

[target.'cfg(target_os = "macos")'.dependencies]
napi = { version = "3", features = ["napi9"] }
napi-derive = "3"
block2 = "0.6"
objc2 = "0.6"
objc2-app-kit = "0.3"

[target.'cfg(target_os = "windows")'.dependencies]
napi = { version = "3", features = ["napi9"] }
napi-derive = "3"
winreg = "0.55"
windows-core = "0.62"

[target.'cfg(target_os = "windows")'.dependencies.windows]
version = "0.62"
features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_UI_Accessibility", "Win32_UI_HiDpi", "Win32_System_Com", "Win32_System_Threading", "Win32_System_LibraryLoader", "Win32_System_Variant", "Win32_System_Ole"]
